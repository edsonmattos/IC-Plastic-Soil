# =============================================================================
# projeto-09-fungo — ITS fúngico, MiSeq 2x251
# BioProject: PRJNA1155845 / Submission: SUB14700743
# Amostras: SRR30517334–SRR30517381 (48 amostras)
#
# ATENÇÃO: este grupo requer pipeline ITS, não 16S.
#   - Classificador: UNITE (baixar com scripts/04_download_unite_classifier.sh)
#   - TRUNC_F=0 e TRUNC_R=0 — ITS tem comprimento variável, não truncar
#   - Primers: confirmar no artigo do BioProject (provavelmente ITS1F/ITS2)
#     ITS1F: CTTGGTCATTTAGAGGAAGTAA (22 bp)
#     ITS2:  GCTGCGTTCTTCATCGATGC  (20 bp)
# =============================================================================
PROJECT_NAME="projeto-09-fungo"

# Caminhos
SRA_IDS_FILE="data/projeto-09-fungo/manifests/sra_ids_projeto-09-fungo.txt"
READS_DIR="data/projeto-09-fungo/raw/samples"
MANIFEST="data/projeto-09-fungo/manifests/manifest_projeto-09-fungo.tsv"
METADATA="data/projeto-09-fungo/manifests/metadata_projeto-09-fungo.tsv"
OUTDIR="results/projeto-09-fungo"
CLASSIFIER="refs/unite-classifier.qza"  # TODO: baixar classificador UNITE

# Sequenciamento
SEQ_MODE="paired"          # 2x251 bp

# Parâmetros DADA2 para ITS
THREADS=10
TRUNC_F=0                  # ITS: comprimento variável — não truncar
TRUNC_R=0                  # ITS: comprimento variável — não truncar
TRIM_F=22                  # ITS1F (22 bp) — confirmar no artigo
TRIM_R=20                  # ITS2 (20 bp)  — confirmar no artigo
MAX_EE_F=2
MAX_EE_R=2

# Diversidade
SAMPLING_DEPTH=5000        # definir após denoising-stats.qzv
