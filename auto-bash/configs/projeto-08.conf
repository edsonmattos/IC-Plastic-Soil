# =============================================================================
# template.conf — Configuração de projeto para run_pipeline.sh
# Copie este arquivo: cp auto-bash/configs/template.conf auto-bash/configs/projeto-XX.conf
# =============================================================================
# projeto PRJNA631499
# Nome do projeto (usado nos logs e relatórios)
PROJECT_NAME="projeto-08"

# Caminhos
SRA_IDS_FILE="data/projeto-08/manifests/sra_ids_projeto-08.txt"
READS_DIR="data/projeto-08/raw/samples"
MANIFEST="data/projeto-08/manifests/manifest_projeto-08.tsv"
METADATA="data/projeto-08/manifests/metadata_projeto-08.tsv"
OUTDIR="results/projeto-08"
CLASSIFIER="refs/silva-138-99-515-806-nb-classifier.qza"

# Sequenciamento
SEQ_MODE="paired"          # V4 (515F/806R), 2x251 bp, overlap ~177 bp

# Parâmetros DADA2
THREADS=10
TRUNC_F=230                # qualidade Q37 mediana até aqui; reads 251 bp ✓
TRUNC_R=200                # reverse degrada mais cedo; overlap = 177 bp garantido
TRIM_F=19                  # primer 515F = 19 bp (GTGYCAGCMGCCGCGGTAA)
TRIM_R=20                  # primer 806R = 20 bp (GGACTACNVGGGTWTCTAAT)
MAX_EE_F=2                 # Max erros esperados Forward
MAX_EE_R=2                 # Max erros esperados Reverse

# Diversidade
SAMPLING_DEPTH=40000        # exclui automaticamente SRR11749118 (2.484) e SRR11749120 (6.118); mantém 86/88
