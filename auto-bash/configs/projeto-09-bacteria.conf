# =============================================================================
# projeto-09-bacteria — 16S V4 (515F/806R), MiSeq 2x251
# BioProject: PRJNA1155845 / Submission: SUB14702629
# Amostras: SRR30519516–SRR30519563 (48 amostras)
# =============================================================================
PROJECT_NAME="projeto-09-bacteria"

# Caminhos
SRA_IDS_FILE="data/projeto-09-bacteria/manifests/sra_ids_projeto-09-bacteria.txt"
READS_DIR="data/projeto-09-bacteria/raw/samples"
MANIFEST="data/projeto-09-bacteria/manifests/manifest_projeto-09-bacteria.tsv"
METADATA="data/projeto-09-bacteria/manifests/metadata_projeto-09-bacteria.tsv"
OUTDIR="results/projeto-09-bacteria"
CLASSIFIER="refs/silva-138-99-515-806-nb-classifier.qza"

# Sequenciamento
SEQ_MODE="paired"          # V4 (515F/806R), 2x251 bp, overlap ~47 bp

# Parâmetros DADA2
THREADS=10
TRUNC_F=165                # queda abrupta de qualidade após bp 165 (Q34 flat até aqui)
TRUNC_R=135                # queda após bp 130; 135 inclui margem; overlap = 35 bp
TRIM_F=25                  # 6 bp pad + 515F (19 bp) = 25 bp total
TRIM_R=26                  # 6 bp pad + 806R (20 bp) = 26 bp total
MAX_EE_F=2
MAX_EE_R=2

# Diversidade
SAMPLING_DEPTH=20000       # exclui SRR30519554 (11.748) e SRR30519516 (14.405) — merge <18%
