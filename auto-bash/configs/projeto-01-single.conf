# =============================================================================
# template.conf — Configuração de projeto para run_pipeline.sh
# Copie este arquivo: cp auto-bash/configs/template.conf auto-bash/configs/projeto-XX.conf
# =============================================================================

# Nome do projeto (usado nos logs e relatórios)
PROJECT_NAME="projeto-01-single"

# Caminhos
SRA_IDS_FILE="data/manifests/sra_ids_projeto-01.txt"
READS_DIR="data/raw/samples"
MANIFEST="data/manifests/manifest_projeto-01-single.tsv"
METADATA="data/manifests/metadata_projeto-01-single.tsv"
OUTDIR="results/projeto-01-single"
CLASSIFIER="refs/silva-138-99-515-806-nb-classifier.qza"

# Sequenciamento
SEQ_MODE="single"          # paired ou single

# Parâmetros DADA2
THREADS=16
TRUNC_F=240                # Truncar Forward em X bp
TRUNC_R=0                  # ignorado no single
TRIM_F=0                   # Remover X bp do início Forward
TRIM_R=0                   # Remover X bp do início Reverse
MAX_EE_F=2                 # Max erros esperados Forward
MAX_EE_R=2                 # Max erros esperados Reverse
