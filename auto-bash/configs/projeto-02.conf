# =============================================================================
# template.conf — Configuração de projeto para run_pipeline.sh
# Copie este arquivo: cp auto-bash/configs/template.conf auto-bash/configs/projeto-XX.conf
# =============================================================================

# Nome do projeto (usado nos logs e relatórios)
PROJECT_NAME="projeto-02"

# Caminhos
SRA_IDS_FILE="data/manifests/sra_ids_projeto-02.txt"
READS_DIR="data/raw/projeto-02"
MANIFEST="data/manifests/manifest_projeto-02.tsv"
METADATA="data/manifests/metadata_projeto-02.tsv"
OUTDIR="results/projeto-02"
CLASSIFIER="refs/silva-138-99-515-806-nb-classifier.qza"

# Sequenciamento
SEQ_MODE="paired"          # paired ou single

# Parâmetros DADA2
THREADS=16
TRIM_F=17                  # Remove primer 341F (V3-V4 forward, presente nos dados)
TRIM_R=20                  # Remove primer 806R (V3-V4 reverse, presente nos dados)
MAX_EE_F=2                 # Forward: qualidade boa, valor padrão
MAX_EE_R=4                 # Reverse: mais leniente pela queda de qualidade
TRUNC_F=270                # Forward: boa qualidade até ~270bp
TRUNC_R=240                # Reverse: overlap = (270-17)+(240-20)-423 = 50bp ✓
