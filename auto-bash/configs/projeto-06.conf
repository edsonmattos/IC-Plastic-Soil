# =============================================================================
# template.conf — Configuração de projeto para run_pipeline.sh
# Copie este arquivo: cp auto-bash/configs/template.conf auto-bash/configs/projeto-XX.conf
# =============================================================================
# projeto PRJNA630025
# Nome do projeto (usado nos logs e relatórios)
PROJECT_NAME="projeto-06"

# Caminhos
SRA_IDS_FILE="data/projeto-06/manifests/sra_ids_projeto-06.txt"
READS_DIR="data/projeto-06/raw/samples"
MANIFEST="data/projeto-06/manifests/manifest_projeto-06.tsv"
METADATA="data/projeto-06/manifests/metadata_projeto-06.tsv"
OUTDIR="results/projeto-06"
CLASSIFIER="refs/silva-138-99-515-806-nb-classifier.qza"

# Sequenciamento
SEQ_MODE="paired"          # single: amplicon V3-V4 ~466bp não permite overlap com 2x250

# Parâmetros DADA2
THREADS=10
TRUNC_F=270   # forward segura até ~bp 270 (median Q33+)
TRUNC_R=220   # reverse degrada rápido — 220 é mais seguro
TRIM_F=17     # primer 341F = 17 bp
TRIM_R=20     # primer 806R = 20 bp
MAX_EE_F=2
MAX_EE_R=5    # mais leniente por causa do reverse ruim

# Diversidade
SAMPLING_DEPTH=70000        # Profundidade de rarefação (ver denoising-stats.qzv)
