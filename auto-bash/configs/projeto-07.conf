# =============================================================================
# template.conf — Configuração de projeto para run_pipeline.sh
# Copie este arquivo: cp auto-bash/configs/template.conf auto-bash/configs/projeto-XX.conf
# =============================================================================
# projeto PRJNA564156
# Nome do projeto (usado nos logs e relatórios)
PROJECT_NAME="projeto-07"

# Caminhos
SRA_IDS_FILE="data/projeto-07/manifests/sra_ids_projeto-07.txt"
READS_DIR="data/projeto-07/raw/samples"
MANIFEST="data/projeto-07/manifests/manifest_projeto-07.tsv"
METADATA="data/projeto-07/manifests/metadata_projeto-07.tsv"
OUTDIR="results/projeto-07"
CLASSIFIER="refs/silva-138-99-515-806-nb-classifier.qza"

# Sequenciamento
SEQ_MODE="paired"          # V4 (515F/806R), overlap ~177 bp com 2x250

# Parâmetros DADA2
THREADS=10
TRUNC_F=230                # forward OK até ~bp 230; reads mín. 246 bp ✓
TRUNC_R=200                # reverse degrada mais cedo; overlap 177 bp garantido
TRIM_F=19                  # primer 515F = 19 bp (GTGYCAGCMGCCGCGGTAA)
TRIM_R=20                  # primer 806R = 20 bp (GGACTACNVGGGTWTCTAAT)
MAX_EE_F=2                 # Max erros esperados Forward
MAX_EE_R=2                 # Max erros esperados Reverse

# Diversidade
SAMPLING_DEPTH=33000        # mínimo non-chimeric: SRR10076406 com 33.553 — mantém 168/168
